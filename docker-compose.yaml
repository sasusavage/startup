# Deployed by Coolify (Build Pack: Docker Compose).
#
# The database is external and shared with the portfolio site (../port), so
# there is deliberately no postgres service here. DATABASE_URL points at it,
# and our tables live in their own schema (DB_SCHEMA) well away from public.
#
# Set every variable below in Coolify → Environment Variables, and attach your
# domain to the "web" service in Coolify → Domains. No host ports are published
# here on purpose: Coolify's own proxy already owns port 80 on the host, so
# binding it would collide and the deploy would fail to start.

services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      # No SERVICE_FQDN here on purpose — the API must not get a public domain.
      # It is reached only through nginx at /api/*, on the internal network.
      DATABASE_URL: ${DATABASE_URL}
      DB_SCHEMA: ${DB_SCHEMA:-sasusync_site}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://sasusync.com,https://www.sasusync.com}
    expose:
      - '8000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request;urllib.request.urlopen(''http://localhost:8000/api/health'')"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build: .
    restart: unless-stopped
    environment:
      # Coolify magic variable: SERVICE_FQDN_<SERVICE>_<PORT>, declared bare.
      # Coolify fills it in and generates the proxy route for this service.
      # Giving it a value (even an empty default) stops that happening, and
      # nothing gets routed to the site at all.
      - SERVICE_FQDN_WEB_80
      - API_UPSTREAM=api:8000
    expose:
      - '80'
    depends_on:
      - api
