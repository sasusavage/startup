<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="SasuSync">
  <!-- Square, and vector. What was here before was a 373x669 portrait PNG wrapped
       in an SVG: browsers squash a favicon into a square, so the wordmark it held
       arrived as an unreadable sliver. A tab renders this at 16px, which is room
       for one mark and nothing else — the name belongs next to the icon, not
       inside it. -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <!-- The linked-S from the brand mark. Geometry rather than a font, so it cannot
       depend on what the viewer has installed, and stroked heavily because a
       hairline disappears at tab size. -->
  <path d="M17 3H8a5 5 0 0 0 0 10h8a5 5 0 0 1 0 10H7"
        transform="translate(4 4)"
        fill="none" stroke="#ffffff" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
